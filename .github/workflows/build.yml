name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # The plugin is Windows only (SubSync is), so build and test there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Jellyfin.Plugin.SubtitleFixer.slnx -c Release -nologo
      - name: Test
        run: dotnet test Jellyfin.Plugin.SubtitleFixer.slnx -c Release --no-build -nologo
      - name: Package
        shell: pwsh
        run: ./build/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: artifacts/*.zip*
